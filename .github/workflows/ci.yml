name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Tests use their own SQLite file, so no database secrets are needed.
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      - name: Check JavaScript syntax
        run: for f in app/static/js/*.js; do node --check "$f"; done

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t smartgrad:ci .

  # Runs on the self-hosted runner installed on the department server, which
  # pulls jobs from GitHub, so no inbound SSH access to the campus network is needed.
  deploy:
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v4

      - name: Build and start containers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: docker compose -p smartgrad -f docker-compose.prod.yml up -d --build --wait

      - name: Clean up Docker build cache and old image
        run: docker builder prune -af && docker image prune -f
