<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartGrad - Transcript Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">
    <div class="max-w-4xl mx-auto px-4 py-12">
        <!-- Header -->
        <header class="text-center mb-12">
            <h1 class="text-4xl font-bold text-indigo-600 mb-2">SmartGrad</h1>
            <p class="text-gray-500">อัปโหลด Transcript (.pdf) เพื่ออ่านข้อมูลทันที ปลอดภัย 100% ไม่มีการบันทึกข้อมูลของคุณลงระบบ</p>
        </header>

        <!-- Upload Card -->
        <div class="bg-white rounded-2xl shadow-sm p-8 border border-gray-100 mb-8">
            <form action="/" method="POST" enctype="multipart/form-data" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">เลือกไฟล์ Transcript (.pdf) หรือไฟล์ข้อความ (.txt, .csv)</label>
                    <input type="file" name="file" accept=".pdf,.txt,.csv" required
                        class="block w-full text-sm text-gray-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer border border-gray-200 rounded-xl p-2" />
                </div>
                <button type="submit" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-xl transition duration-200">
                    อ่านข้อมูลจาก Transcript
                </button>
            </form>

            {% if error %}
            <div class="mt-4 p-4 bg-red-50 border border-red-200 text-red-600 rounded-xl text-sm">
                {{ error }}
            </div>
            {% endif %}
        </div>

        <!-- Result Display -->
        {% if file_content is not none %}
        <div class="bg-white rounded-2xl shadow-sm p-8 border border-gray-100">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-gray-100">
                <h3 class="font-semibold text-lg text-gray-700">ข้อความที่ดึงมาจาก: <span class="text-indigo-600">{{ filename }}</span></h3>
                <span class="text-xs bg-green-100 text-green-800 font-medium px-2.5 py-1 rounded-full">ดึงข้อมูลบน RAM เท่านั้น</span>
            </div>
            <pre class="bg-gray-900 text-gray-100 p-6 rounded-xl overflow-x-auto font-mono text-sm leading-relaxed max-h-96 whitespace-pre-wrap">{{ file_content }}</pre>
        </div>
        {% endif %}
    </div>
</body>
</html>
