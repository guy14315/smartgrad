name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Tests use their own SQLite file, so no database secrets are needed.
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      - name: Check JavaScript syntax
        run: for f in app/static/js/*.js; do node --check "$f"; done

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t smartgrad:ci .
