name: SmartGrad CI/CD Pipeline

# กำหนดให้ทำงานเมื่อมีการ Push หรือทำ Pull Request เข้ามาที่ branch summer
on:
  push:
    branches: [ "summer" ]
  pull_request:
    branches: [ "summer" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. ดึงโค้ดล่าสุดจาก GitHub ออกมา
    - name: Checkout source code
      uses: actions/checkout@v4

    # 2. ตั้งค่าสภาพแวดล้อม Python เพื่อตรวจสอบความถูกต้องของโค้ด
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    # 3. ทดลองติดตั้ง Dependencies เพื่อเช็คว่า requirements.txt ไม่มีปัญหา
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. สั่งให้ GitHub จำลองการ Build Docker Image อัตโนมัติ
    - name: Build Docker Image
      run: |
        docker build -t smartgrad-app:latest .